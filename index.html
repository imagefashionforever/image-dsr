<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Image DSR</title>
<meta name="theme-color" content="#9c1b74">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Image DSR">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico?v=6" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=6">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png?v=6">
<link rel="icon" type="image/png" sizes="128x128" href="favicon-128.png?v=6">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { --brand: #9c1b74; --violet: #4b1c8c; --text: #1f1a2b; --muted: #6b6478; --bg: #f5f3f8; }
  html, body { margin: 0; height: 100%; background: var(--bg); font-family: Poppins, "Segoe UI", Arial, sans-serif; color: var(--text); }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
  #load { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #fff; transition: opacity .3s; }
  #load img { width: 180px; }
  #load span { color: var(--muted); font-size: 14px; }
  .ban { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 10; background: #fff; border-radius: 16px;
         box-shadow: 0 10px 34px rgba(40,10,60,.25); padding: 14px; display: none; gap: 12px; align-items: center; max-width: 520px; margin: 0 auto; }
  .ban.on { display: flex; }
  .ban img { width: 46px; height: 46px; border-radius: 12px; border: 1px solid #eee; flex: 0 0 auto; }
  .ban .t { flex: 1; min-width: 0; font-size: 14px; line-height: 1.35; }
  .ban .t b { display: block; font-size: 15px; }
  .ban button { border: 0; border-radius: 10px; padding: 10px 14px; font: inherit; font-weight: 700; cursor: pointer; }
  .ban .go { background: linear-gradient(90deg, var(--brand), var(--violet)); color: #fff; white-space: nowrap; }
  .ban .x { background: none; color: var(--muted); padding: 6px 8px; font-size: 20px; line-height: 1; }
  .share { display: inline-block; vertical-align: -3px; width: 17px; height: 17px; }
</style>
</head>
<body>
<div id="load"><img src="icon-512.png" alt="Image"><span>Opening Image DSR...</span></div>

<!-- =========================================================
     PUT YOUR APPS SCRIPT WEB APP LINK HERE (Deploy > Manage deployments > Web app URL, ends with /exec)
     ========================================================= -->
<iframe id="app" title="Image DSR" allow="camera; microphone; clipboard-read; clipboard-write; geolocation"
        src="https://script.google.com/macros/s/AKfycbzPmnCgugVUtT0TlRGaT_A9yEuz4H2claaL_iFXx-XmUjPmNkwRomZ031KHk3tKIFtb-g/exec"></iframe>

<!-- Android / Chrome: one-tap install -->
<div class="ban" id="banA">
  <img src="icon-192.png" alt="">
  <div class="t" style="display:flex;align-items:center"><b></b> </div>
  <button class="go" id="goA" type="button">Install</button>
  <button class="x" data-x="banA" type="button" aria-label="Close">&times;</button>
</div>
<!-- Android without the install box: 2-step hint -->
<div class="ban" id="banM">
  <img src="icon-192.png" alt="">
  <div class="t"><b>Install App</b>Tap <b style="display:inline">&#8942;</b> (top right), then <b style="display:inline">Install app</b> / <b style="display:inline">Add to Home screen</b>.</div>
  <button class="x" data-x="banM" type="button" aria-label="Close">&times;</button>
</div>
<!-- iPhone: Apple allows only the Share menu -->
<div class="ban" id="banI">
  <img src="icon-192.png" alt="">
  <div class="t"><b>Install App</b>Tap
    <svg class="share" viewBox="0 0 24 24" fill="none" stroke="#2f75d5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
    <b style="display:inline">Share</b> below, then <b style="display:inline">Add to Home Screen</b>.</div>
  <button class="x" data-x="banI" type="button" aria-label="Close">&times;</button>
</div>

<script>
  const $ = id => document.getElementById(id);
  $('app').addEventListener('load', () => { $('load').style.opacity = 0; setTimeout(() => $('load').remove(), 300); });
  setTimeout(() => { const l = $('load'); if (l) { l.style.opacity = 0; setTimeout(() => l.remove(), 300); } }, 8000);

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

  const installed = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const snoozed = () => { try { return Date.now() < +(localStorage.getItem('dsr_a2hs_snooze') || 0); } catch (e) { return false; } };
  const snooze = days => { try { localStorage.setItem('dsr_a2hs_snooze', Date.now() + days * 86400000); } catch (e) {} };
  document.querySelectorAll('[data-x]').forEach(b => b.addEventListener('click', () => { $(b.dataset.x).classList.remove('on'); snooze(1); }));

  // Android / desktop Chrome, Edge, Samsung Internet: the browser gives us its install box
  let ask = null;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); ask = e;
    if (!installed && !snoozed()) setTimeout(() => $('banA').classList.add('on'), 2500);
  });
  $('goA').addEventListener('click', async () => {
    $('banA').classList.remove('on');
    if (!ask) return;
    ask.prompt();
    const r = await ask.userChoice.catch(() => ({}));
    if (r && r.outcome !== 'accepted') snooze(1);
    ask = null;
  });
  // installed: just hide (no long snooze), so after an uninstall the offer comes back by itself
  window.addEventListener('appinstalled', () => { $('banA').classList.remove('on'); $('banM').classList.remove('on'); try { localStorage.removeItem('dsr_a2hs_snooze'); } catch (e) {} });

  // Android Chrome sometimes holds back its install box (e.g. just after an uninstall):
  // then show the 2-step hint instead, but only if the app is really not installed
  const android = /android/i.test(navigator.userAgent);
  setTimeout(async () => {
    if (!android || installed || ask || snoozed()) return;
    try {
      if (navigator.getInstalledRelatedApps) { const a = await navigator.getInstalledRelatedApps(); if (a && a.length) return; }
    } catch (e) {}
    $('banM').classList.add('on');
  }, 5000);

  // iPhone / iPad Safari: no install box exists, show the 2-step hint
  const iOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const safari = /safari/i.test(navigator.userAgent) && !/crios|fxios|edgios/i.test(navigator.userAgent);
  if (iOS && safari && !installed && !snoozed()) setTimeout(() => $('banI').classList.add('on'), 2500);
</script>
</body>
</html>
