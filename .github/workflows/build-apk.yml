# Builds the Image DSR Android app (APK) and puts it on the website as image-dsr.apk
# Runs by itself when anything in android-app/ changes, or by hand: Actions > Build Image DSR APK > Run workflow
name: Build Image DSR APK

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Firebase file
        run: |
          if [ ! -f android-app/app/google-services.json ]; then
            echo "::error::android-app/app/google-services.json is missing. Download it from Firebase (Project settings > Your apps > Android app com.imagefashion.dsr) and upload it to android-app/app/"
            exit 1
          fi

      - name: App icon from the website
        run: |
          if [ -f icon-512.png ]; then cp icon-512.png android-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          elif [ -f icon-192.png ]; then cp icon-192.png android-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png; fi

      - name: Signing key
        id: key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            echo "new=0" >> "$GITHUB_OUTPUT"
            PASS="$KS_PASS"
          else
            # First build: make a signing key. SAVE IT as repository secrets (see the "SIGNING-KEY" download).
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$KS" -alias dsr -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Image DSR, O=Image Fashion, C=IN"
            mkdir -p "$RUNNER_TEMP/signing-key"
            base64 -w0 "$KS" > "$RUNNER_TEMP/signing-key/KEYSTORE_BASE64.txt"
            printf '%s' "$PASS" > "$RUNNER_TEMP/signing-key/KEYSTORE_PASSWORD.txt"
            cat > "$RUNNER_TEMP/signing-key/READ-ME.txt" <<'TXT'
          Repository > Settings > Secrets and variables > Actions > New repository secret
            Name KEYSTORE_BASE64    -> paste the whole text of KEYSTORE_BASE64.txt
            Name KEYSTORE_PASSWORD  -> paste the text of KEYSTORE_PASSWORD.txt
          Then run this workflow again. Keep these two files safe: without them future updates
          cannot be installed over the old app.
          TXT
            echo "new=1" >> "$GITHUB_OUTPUT"
          fi
          echo "::add-mask::$PASS"
          echo "KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=dsr" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle -p android-app assembleRelease --no-daemon --stacktrace

      - name: Keep the signing key (first build only)
        if: steps.key.outputs.new == '1'
        uses: actions/upload-artifact@v4
        with:
          name: SIGNING-KEY-add-as-secrets
          path: ${{ runner.temp }}/signing-key/
          retention-days: 7

      - name: APK download
        uses: actions/upload-artifact@v4
        with:
          name: image-dsr-apk
          path: android-app/app/build/outputs/apk/release/app-release.apk

      - name: Put the APK on the website (image-dsr.apk)
        if: steps.key.outputs.new == '0'
        run: |
          cp android-app/app/build/outputs/apk/release/app-release.apk image-dsr.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add image-dsr.apk
          git commit -m "Image DSR app build ${{ github.run_number }}" || exit 0
          git pull --rebase
          git push

      - name: First build note
        if: steps.key.outputs.new == '1'
        run: |
          echo "::warning::First build: a new signing key was made. Download 'SIGNING-KEY-add-as-secrets' (bottom of this page), add KEYSTORE_BASE64 and KEYSTORE_PASSWORD as repository secrets, then run this workflow again. The APK goes on the website only after that."
